<!-- INICIALIZACIÓN FINAL (espera a que el layout esté cargado) -->
<script>
  document.addEventListener("layoutLoaded", () => {
    if(typeof initAuth === "function") initAuth();
    
    // Cargar sesión guardada si existe
    const token = localStorage.getItem("al_session");
    const email = localStorage.getItem("al_email");
    
    if(token && email && typeof onAuthed === "function"){
      onAuthed(token, email);
      apiCall("obtenerProgreso", {sessionToken: token}).then(data=>{
        if(data.progreso && typeof restoreProgress === "function") restoreProgress(data.progreso);
      }).catch(()=>{});
    }
  });
</script>

</body>
